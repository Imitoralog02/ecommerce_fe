org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project is on D: while Flutter plugins are resolved from the Pub cache on
# C:. Kotlin incremental compilation cannot relativize sources across different
# Windows drive roots and corrupts the plugin cache (for example,
# shared_preferences_android). Compile Kotlin non-incrementally and in-process
# so Android builds remain deterministic in this layout.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
